name: Installation source checks
on: [push, pull_request]
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python install.py --check
      - run: python -m unittest discover -s tests -v
      - run: |
          mkdir -p /tmp/qoder-java
          javac -d /tmp/qoder-java android-installer/src/com/qoder/share/tools/PayloadServer.java android-installer/src/com/qoder/share/tools/SetupScript.java android-installer/tests/InstallerProtocolTest.java
          java -cp /tmp/qoder-java InstallerProtocolTest
