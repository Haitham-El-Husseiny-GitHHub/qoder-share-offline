<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qoder Cloud</title><style>body{font:16px system-ui;background:#f7f8f6;color:#1f3627;padding:18px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #aab8aa;border-radius:10px;background:white;box-sizing:border-box;min-height:48px}input,select,textarea{width:100%;margin:6px 0 12px}button{background:#d3e7ce;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:12px}label{font-weight:600;display:block}.error{color:#a02929}</style></head><body>
<h1>Qoder Cloud</h1><p>All advertised models · your existing Qoder login</p>
<label>Find model</label><input id="filter" placeholder="Search models"><label>Model</label><select id="model"></select><p id="catalog"></p><button id="refresh">Refresh catalog</button>
<label>Source folder or file</label><input id="directory"><label>Task</label><textarea id="objective" rows="5" placeholder="Describe your coding task"></textarea><button id="run">Run task</button><button id="stop">Stop</button><p id="error" class="error"></p><pre id="output">No task yet.</pre><script src="/cloud.js"></script></body></html>
