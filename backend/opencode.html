<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCode Go · Sessions</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f7f8f6;color:#202622;margin:0;padding:18px;min-height:100dvh;display:flex;flex-direction:column}button,input,textarea{font:inherit;border:1px solid #e0e2e0;border-radius:16px;min-height:46px;padding:10px 14px}button{background:#efeff0;color:inherit;cursor:pointer}button:disabled{opacity:.55}button.success{background:#d3e7ce}button.failed{background:#ffead4}header{display:flex;align-items:center;gap:12px}h1{font-size:25px;flex:1}small{color:#6d746f}.connection{font-size:13px;display:flex;flex-wrap:wrap;gap:10px}.good{color:#347647}.bad{color:#a83232}.muted{color:#777}.chips{display:flex;gap:8px;margin:20px 0}.chips button[aria-pressed=true]{border-color:#242a26;font-weight:600}.session{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #e7e9e7;border-radius:0;padding:19px 8px}.session small{display:block;margin-top:5px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar #model{flex:1;text-align:left}.toolbar a{color:inherit;font-size:13px}#chat{flex:1;display:flex;flex-direction:column}#list{flex:1}#messages{flex:1;min-height:35vh;margin:20px 0}.message{background:white;border-radius:18px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:18%;background:#eaecea}.message small{display:block;margin-bottom:8px}.tool{font:13px monospace}.composer{position:sticky;bottom:0;background:#f7f8f6;display:flex;align-items:end;gap:8px;padding:12px 0}.composer textarea{flex:1;min-width:0;resize:vertical;background:white;max-height:160px}.error{color:#a83232;white-space:pre-wrap}dialog{border:1px solid #ddd;border-radius:20px;width:calc(100% - 32px);max-width:560px;max-height:80vh;padding:18px}dialog::backdrop{background:#0005}.modelrow{width:100%;background:white;text-align:left;margin:4px 0}.modelrow small{display:block;margin-top:5px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.peak{background:#b64545}.offpeak{background:#3d8c54}.standard{background:#8a8f8b}[hidden]{display:none!important}#new{position:fixed;right:24px;bottom:28px;font-size:26px;border-radius:50%;width:58px;height:58px;background:#efeff0;color:#202622}
</style></head><body>
<header><button id="back" hidden aria-label="Back to sessions">‹</button><h1 id="heading">OpenCode Go</h1><button id="menu" aria-label="Session menu">⋯</button></header>
<div class="connection"><span id="termux" class="muted">Termux · checking</span><span id="rish" class="muted">Rish · checking</span><span id="shell" class="muted">Shell · checking</span><span id="service" class="muted">OpenCode · checking</span></div>
<button id="allowance" style="align-self:flex-start;min-height:30px;padding:4px 10px;font-size:12px;margin-top:8px" title="Open verified account usage">Go allowance · checking</button>
<section id="list"><div class="chips"><button id="all" aria-pressed="true">All</button><button aria-pressed="false" id="localhost">CLI · localhost</button></div><small id="liststatus">Loading sessions…</small><div id="sessions"></div><button id="new" aria-label="New session">+</button></section>
<section id="chat" hidden><div class="toolbar"><button id="model">Choose model ▾</button><a href="https://opencode.ai/console" target="_blank" rel="noopener">Usage ↗</a></div><small id="priceNote">Prices per 1M tokens · Go allowance usage</small><div id="messages"></div><div class="composer"><textarea id="objective" rows="2" placeholder="Describe your coding task…" aria-label="Message"></textarea><button id="send">Send</button><button id="stop" hidden>Stop</button></div></section>
<p id="error" class="error" role="alert"></p>
<dialog id="models"><header><h2>OpenCode Go models</h2><button id="closeModels">×</button></header><small>Red: peak · Green: off-peak · Gray: fixed price</small><div id="modelRows"></div><button id="refresh">Refresh models</button></dialog>
<dialog id="options"><h2>Session menu</h2><button id="connect">Connect OpenCode Go</button><button id="diff">Review changes</button><button id="closeOptions">Close</button></dialog>
<dialog id="credentials"><h2>OpenCode Go API key</h2><input id="key" type="password" autocomplete="off" aria-label="OpenCode Go API key"><button id="saveKey">Connect</button><button id="closeKey">Cancel</button></dialog>
<script src="/opencode.js"></script></body></html>
