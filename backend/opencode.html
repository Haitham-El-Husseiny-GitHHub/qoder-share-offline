<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCode</title><style>
body{font:16px system-ui;background:#f7f8f6;color:#1f3627;margin:0;padding:18px}h1{font-size:24px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #aab8aa;border-radius:10px;background:white;box-sizing:border-box;min-height:48px}input,select,textarea{width:100%;margin:6px 0 12px}button{background:#d3e7ce;margin:4px 4px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:12px;font:14px system-ui}label{display:block;font-weight:600}details{margin:14px 0}.error{color:#a02929}</style></head><body>
<h1>OpenCode</h1><p id="status">Connecting…</p>
<label>Source folder or file</label><input id="directory" placeholder="Any accessible source path">
<label>Provider / model</label><select id="model"></select><button id="refresh">Refresh models</button>
<details><summary>Connect API provider</summary><input id="provider" placeholder="Provider ID: deepseek, anthropic, alibaba…"><input id="base" placeholder="Custom API base URL (optional)"><input id="modelID" placeholder="Custom model ID (when using a base URL)"><input id="key" type="password" placeholder="API key" autocomplete="off"><button id="connect">Save connection</button></details>
<label>Task</label><textarea id="objective" rows="5" placeholder="Describe the coding task. Name the app for automatic source discovery."></textarea>
<label>Agent</label><select id="agent"><option value="build">Build</option><option value="plan">Plan</option></select>
<button id="discover">Find source</button><button id="send">Send task</button><button id="stop">Stop</button><button id="fresh">New session</button><button id="diff">Review changes</button>
<p id="error" class="error"></p><pre id="output">No task yet.</pre><script src="/opencode.js"></script></body></html>
